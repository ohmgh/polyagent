[project]
name = "polyagent-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "pyright>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["scripts", "tests"]
typeCheckingMode = "basic"
